[package]
name = "dns-c2"
version = "0.1.0"
edition = "2021"
authors = ["Jeremy Laratro <jay@aradex.io>"]
description = "DNS-native C2 framework — Cloudflare is the server, DNS is the database, one binary does everything."
license = "CC-BY-NC-SA-4.0"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
blake3 = "1"
chacha20poly1305 = "0.10"
rand = "0.8"
clap = { version = "4", features = ["derive", "env"] }
log = "0.4"
env_logger = "0.11"
thiserror = "2"
async-trait = "0.1"
hex = "0.4"
libc = "0.2"
zstd = "0.13"

[profile.release]
opt-level = 3
lto = true
strip = true
