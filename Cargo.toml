[package]
name = "dnfs"
version = "0.5.0"
edition = "2021"
authors = ["Jeremy Laratro <jay@aradex.io>"]
description = "Dn(f)s — A DNS-backed encrypted filesystem. Store files as encoded DNS TXT records."
license = "CC-BY-NC-SA-4.0"
repository = "https://github.com/d0sf3t/dnfs"
keywords = ["dns", "fuse", "filesystem", "encryption", "security"]
categories = ["filesystem", "command-line-utilities"]

[dependencies]
fuser = "0.15"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
blake3 = "1"
chacha20poly1305 = "0.10"
rand = "0.8"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
libc = "0.2"
thiserror = "2"
async-trait = "0.1"
hex = "0.4"
lru = "0.12"
zstd = "0.13"
futures = "0.3"
tar = "0.4"
flate2 = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
